function persist(){try{localStorage.setItem(SAVE,JSON.stringify(state));}catch{}}
function humanTurn(){return state&&state.active===0&&!state.pending&&state.winner===null;}
function start(){const cpu=[...IDS].sort(()=>Math.random()-.5).slice(0,3),cpuLeader=cpu[Math.floor(Math.random()*3)];state=IDOL.create([...team],leader,cpu,cpuLeader,firstMode==='random'?(Math.random()<.5?0:1):Number(firstMode));screen='match';resultShown=false;aiSteps=0;modal=null;persist();render();schedule();}
function send(a){try{IDOL.dispatch(state,a);modal=null;selection={};persist();render();schedule();}catch(e){notify(e.message);}}
function schedule(){
 clearTimeout(aiTimer);
 if(!state||screen!=='match'||modal)return;
 if(state.winner!==null){if(!resultShown){resultShown=true;modal={kind:'result'};renderModal();}return;}
 const isCPU=state.pending?state.pending.p===1:state.active===1;
 if(isCPU){aiTimer=setTimeout(()=>{if(modal)return;try{const a=IDOL.ai(state);if(a.type==='end')aiSteps=0;else aiSteps++;if(aiSteps>90&&!state.pending)send({type:'end'});else send(a);}catch(e){notify('CPUの処理を停止しました：'+e.message);console.error(e);}},550);}
}
function render(){
 $('#app').innerHTML=screen==='setup'?setupHTML():matchHTML();
 renderModal();
}
function setupHTML(){return '<div class="intro"><div><div class="eyebrow">BUILD YOUR UNIT. OWN THE STAGE.</div><h1>この3人で、<br>ステージを変える。</h1><p>アイドルを3人選び、リーダーを決めてCPUと対バン。<br>観客を集めて、先に20ポイントを目指そう。</p></div><div class="step">01 編成　 /　 02 リーダー　 /　 03 開演</div></div>'+
(saved?'<div class="resume"><span>中断したライブがあります</span>'+btn('続きから','resume','small primary')+'</div>':'')+
'<div class="setup-layout"><section><div class="section-line"><h2>メンバーを選択</h2><span class="counter">'+team.length+' / 3 SELECTED</span></div><div class="char-grid">'+IDS.map(id=>{const c=CHAR[id],idx=team.indexOf(id);return '<button class="char-card '+(idx>=0?'selected':'')+'" data-action="team" data-id="'+id+'" aria-pressed="'+(idx>=0)+'" style="--c:'+c.color+'">'+art('idol-'+id)+(idx>=0?'<span class="pick-number">'+(idx+1)+'</span>':'')+'<div class="char-content"><span class="tag">'+role[id]+'</span><h3>'+c.name+'</h3><small>初期vol '+c.vol+'％　/　手札 '+c.hand+'枚</small><p>'+c.skill+'</p></div></button>';}).join('')+'</div></section><aside class="panel setup-side"><div class="eyebrow">YOUR UNIT</div><h2>ライブの準備</h2><small>リーダーを1人選択</small><div class="leader-options">'+team.map(id=>'<button class="leader-option '+(leader===id?'on':'')+'" data-action="leader" data-id="'+id+'">'+charDot(id)+'<span><strong>'+CHAR[id].name+(leader===id?'　♛':'')+'</strong><small>vol '+CHAR[id].vol+'％ / 手札 '+CHAR[id].hand+'枚</small></span></button>').join('')+'</div>'+(leader&&team.includes(leader)?'<div class="leader-skill"><b>LEADER SKILL</b><br>'+CHAR[leader].skill+'</div>':'')+'<label for="first">先攻・後攻</label><select id="first"><option value="random" '+(firstMode==='random'?'selected':'')+'>ランダム</option><option value="0" '+(firstMode==='0'?'selected':'')+'>あなたが先攻</option><option value="1" '+(firstMode==='1'?'selected':'')+'>CPUが先攻</option></select><div class="divider"></div>'+btn('CPUとライブを始める　↗','start','pink wide',team.length!==3)+'<p class="setup-note">CPUは6人から3人をランダムに編成。<br>選んだ3人の専用楽曲27枚と専用イベント3枚を使用します。</p><div class="divider"></div><small>カードイラストは後から追加予定です。<br>現在はCPU戦のみ遊べます。</small></aside></div>';}
function scoreHTML(p,i){return '<div class="score-panel '+(state.active===i?'turn':'')+'"><div class="score-head"><div><strong>'+(i?'CPU UNIT':'YOUR UNIT')+'</strong> <span class="tag">'+(state.active===i?'ON STAGE':'WAITING')+'</span></div><div class="score-number">'+IDOL.score(p)+'<small> / 20 pt</small></div></div><div class="score-team">'+p.team.map(id=>(id===p.leader?'♛ ':'')+CHAR[id].name).join(' / ')+'</div><div class="vol-row"><b>VOL</b><div class="vol-track"><i style="width:'+p.vol/2+'%"></i></div><b>'+p.vol+'％</b></div><div class="stats-row"><span>応援 <b>'+p.chips+'</b></span><span>山札 <b>'+p.deck.length+'</b></span><span>手札 <b>'+p.hand.length+'</b></span><span>メモリー <b>'+p.memory.length+'</b></span><span>捨て札 <b>'+p.discard.length+'</b></span></div><div class="mini-actions" style="margin-top:8px">'+btn('獲得観客 '+p.fans.length,'inspect','small flat',false,'data-zone="fans" data-p="'+i+'"')+btn('メモリー','inspect','small flat',false,'data-zone="memory" data-p="'+i+'"')+btn('捨て札','inspect','small flat',false,'data-zone="discard" data-p="'+i+'"')+'</div></div>';}
function fanHTML(f,idx=null){const d=FAN[f.type];return '<div class="fan-card '+f.type+'">'+(idx!==null?'<div class="queue-label">'+(idx===0?'01 / 先頭':'0'+(idx+1))+'</div>':'')+'<div class="fan-head"><h3>'+d.name+'</h3><span class="points">'+d.points+'<small> PT</small></span></div>'+art('fan-'+f.type)+'<p>'+d.text+'</p>'+(f.lock!==null?'<span class="lock">'+(f.lock===0?'あなた':'CPU')+'の独占</span>':'')+'</div>';}
function songHTML(c,interactive=true){const d=IDOL.detail(c),p=state?.players[0],can=p&&!!IDOL.actors(p,c);return '<'+(interactive?'button':'div')+' class="song-card" style="--c:'+CHAR[c.owner].color+'" '+(interactive?'data-action="song" data-id="'+c.uid+'"':'')+'><div class="song-meta"><span>'+CHAR[c.owner].short+' / '+c.n+'人用</span><span>SONG</span></div><h3>'+d.name+'</h3>'+art('song-'+c.owner+'-'+c.n)+'<div class="song-line"><span>VOL</span><b>＋'+d.vol+'％</b></div><div class="song-line"><span>FAN <small>必要 '+d.need+'％</small></span><b>＋'+d.fan+'</b></div>'+(d.volText?'<p><b>vol：</b>'+d.volText+'</p>':'')+(d.fanText?'<p><b>fan：</b>'+d.fanText+'</p>':'')+(interactive&&!can?'<div class="unavailable">指定メンバー・行動人数が必要</div>':'')+'</'+(interactive?'button':'div')+'>';}
function matchHTML(){
 const p=state.players[0],q=state.players[1],ok=humanTurn(),z=state.pending;

class="section-line"><h2>専用イベント</h2><small>各1回</small></div><div class="event-list">'+p.events.map(e=>{const d=CHAR[e.id];return '<div class="event-card '+(e.used?'used':'')+'" style="--c:'+d.color+'">'+art('event-'+e.id)+'<h3>'+d.event+'</h3><p>'+d.effect+'</p><small>'+d.short+' '+d.cost[0]+'枚を含む計'+d.cost[1]+'メモリー</small>'+btn(e.used?'使用済み':IDOL.eventOK(state,0,e.id)?'イベントを使用':'条件未達','event','small',!ok||!IDOL.eventOK(state,0,e.id),'data-id="'+e.id+'"')+'</div>';}).join('')+'</div><div class="panel support-panel"><div class="section-line"><h3>応援チップ効果</h3><b>✦ '+p.chips+'</b></div>'+btn('2枚 → カードを1枚引く','draw','',!ok||p.chips<2||!p.deck.length)+btn('6枚 → 全員を未行動にする','refresh','',!ok||p.chips<6||p.ready.every(Boolean))+(p.leader==='rai'?btn('1枚 → 独占チップを置く','lock','',!ok||p.chips<1||state.row.some(f=>f.lock===0)):'')+'<p class="setup-note">リーダー：'+CHAR[p.leader].skill+'</p></div><div class="panel log-panel"><h3>ライブログ</h3><div class="log-list">'+state.log.slice(-18).reverse().map(t=>'<p>'+t+'</p>').join('')+'</div></div></aside></div>';
}
function dialog(title,body,large=false,close=true){return '<div class="overlay"><section class="dialog '+(large?'large':'')+'" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="dialog-head"><div><div class="eyebrow">IDOL / LIVE DUEL</div><h2>'+title+'</h2></div>'+(close?btn('×','close','','', 'aria-label="閉じる"'):'')+'</div>'+body+'</section></div>';}
function choiceFan(f,action,on=false){return '<button class="choice-card '+(on?'on':'')+'" data-action="'+action+'" data-id="'+f.uid+'"><h3>'+FAN[f.type].name+'　'+FAN[f.type].points+'pt</h3>'+art('fan-'+f.type)+'<small>'+FAN[f.type].text+'</small></button>';}
function memChoice(c,action,on){return '<button class="choice-card '+(on?'on':'')+'" data-action="'+action+'" data-id="'+c.uid+'" style="border-top:3px solid '+CHAR[c.owner].color+'"><small>'+CHAR[c.owner].short+' / '+c.n+'人用</small><h3>'+IDOL.song(c).name+'</h3></button>';}

 const root=$('#modal');
 if(state&&screen==='match'&&state.pending?.p===0&&!modal){const z=state.pending;let body='';
 if(z.kind==='shio')body='<p>応援チップの獲得を置き換えられます。</p><div class="mode-grid">'+btn('応援チップ＋1','choose','primary',false,'data-id="chip"')+btn('ボルテージ＋10％','choose','primary',false,'data-id="vol"')+'</div>';
 else {const fs=[...state.players[0].fans,...state.row,...state.audience.slice(0,2)].filter(f=>z.options.includes(f.uid));body='<div class="choice-grid">'+fs.map(f=>choiceFan(f,'choose')).join('')+'</div>';}

 }

function rulesHTML(){return '<div class="rules"><h3>1. 編成と勝利条件</h3><p>6人から3人を選び、1人をリーダーにします。専用楽曲は各3種類×3枚、3人で27枚。選んだメンバーの専用イベントを1枚ずつ用意します。初期volと初期手札はリーダーで決まります。</p><p>観客の得点と一時的な得点を合わせて20点以上で勝利。観客をまとめて獲得した場合は、マイナス効果を含むすべての処理を終えてから判定します。</p><h3>2. ターンと楽曲</h3><ol><li>自分のアイドル全員を未行動に戻し、1枚ドロー。先攻の最初のターンだけドローなし。</li><li>楽曲、ファンサービス、イベント、応援チップ効果を好きな順で使用。いつでもターン終了できます。</li><li>楽曲には指定メンバーを含む1〜3人の未行動アイドルが必要。行動したアイドルはそのターン再使用できません。</li><li>volモードは必要volなし。fanモードは指定vol以上が必要ですが、volは消費しません。対応するモードの追加効果だけ発動します。</li><li>使用した楽曲はメモリーへ。イベントのコストとして支払ったメモリーは捨て札へ。</li></ol><h3>3. ボルテージ・応援</h3><p>volの範囲は0〜200％。「－10％」は80％→70％のように増減します。手札上限はありません。</p><ul><li>ファンサービス：未行動1人を行動済みにして応援チップ1枚。各ターン2回まで。</li><li>応援チップ2枚：1枚ドロー。6枚：自分の全員を未行動に。</li><li>イベントの使用にアイドルの行動は不要。指定がなければ対戦中1回。</li></ul><h3>4. 観客</h3><p>共有デッキは52枚。通常は公開中の観客を先頭から獲得します。一度に4枚以上なら、公開中の3枚を取り、残りはデッキ上から取ります。その後、空きを詰めて3枚に補充。相手の独占チップ付き観客は飛ばします。</p><table><thead><tr><th>観客</th><th>点</th><th>枚数</th><th>効果</th></tr></thead><tbody>'+Object.values(FAN).map(f=>'<tr><td>'+f.name+'</td><td>'+f.points+'</td><td>'+f.count+'</td><td>'+f.text+'</td></tr>').join('')+'</tbody></table><p>獲得した観客は全員分の効果が発動します。先頭から処理し、厄介なファンはまだ戻されていない同時獲得観客から自身以外の最高得点1枚を戻します。同点なら獲得した側が選択。戻された観客も獲得時の効果は消えません。</p><h3>5. 独占・追加効果</h3><ul><li>独占チップは付け替え不可。観客がゾーンを離れると回収し、再び応援チップ1枚で置けます。</li><li>雷の選択獲得は通常獲得を丸ごと置き換えて1枚獲得。見て選ばなかったデッキのカードは元の順番で戻します。</li><li>華の強化は応援チップ効果の使用1回ごとに＋1。累積し、次のファン獲得で消費。volモードでは消費せず、ターン終了時に消滅。「雷鳴」の追加支払いでは発動しません。</li><li>夏芽のリーダー能力は自分の全メンバーの3人用楽曲に適用。専用イベントの強化は楽曲だけが対象です。</li></ul><h3>6. 敗北</h3><p>山札切れだけでは敗北しません。引けないドローは行わず続行。山札0枚・手札0枚・使用可能なイベントなし、の3条件をすべて満たすと敗北します。効果の途中ではなく、ひとまとまりの処理後に勝敗を判定します。</p><div class="rule-note">試作での処理：同時に20点以上なら手番プレイヤーを優先。観客デッキにコアファンがない場合、雷の交換イベントは使用不可。独占チップはゲーム開始時に手元へ用意。CPUの手札・伏せたイベントは表示しません。</div></div>';}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
 const a=b.dataset.action,id=b.dataset.id;
 if(a==='team'){if(team.includes(id))team=team.filter(x=>x!==id);else if(team.length<3)team.push(id);else{notify('先にメンバーを1人外してください');return;}if(!team.includes(leader))leader=team[0]||null;render();}
 if(a==='leader'){leader=id;render();}
 if(a==='start')start();
 if(a==='resume'){state=saved;screen='match';modal=null;resultShown=false;render();schedule();}
 if(a==='rules'||a==='catalog'){modal={kind:a,tab:'kayo'};renderModal();}
 if(a==='catalog-tab'){modal.tab=id;renderModal();}
 if(a==='close'){modal=null;renderModal();schedule();}
 if(a==='leave'){modal={kind:'leave'};renderModal();}
 if(a==='leave-confirm'){clearTimeout(aiTimer);saved=state;screen='setup';modal=null;render();}
 if(a==='new-match'){clearTimeout(aiTimer);screen='setup';saved=null;modal=null;render();}
 if(a==='rematch')start();
 if(a==='inspect'){modal={kind:'inspect',p:Number(b.dataset.p),zone:b.dataset.zone};renderModal();}
 if(a==='peek'&&humanTurn()){modal={kind:'peek'};renderModal();}
 if(a==='song'){if(!humanTurn()){notify('あなたの手番で効果の処理後に使えます');return;}const c=state.players[0].hand.find(c=>c.uid===id);modal={kind:'song',id};selection={actors:IDOL.actors(state.players[0],c)||[],boost:false,pick:false};renderModal();}
 if(a==='play-vol'||a==='play-fan')send({type:'play',card:modal.id,actors:selection.actors,mode:a==='play-vol'?'vol':'fan',boost:a==='play-fan'&&selection.boost,pick:a==='play-fan'&&selection.pick});
 if(a==='service')send({type:'service',actor:Number(id)});
 if(a==='draw'||a==='refresh')send({type:'support',effect:a});
 if(a==='end')send({type:'end'});
 if(a==='choose')send({type:'choose',value:id});
 if(a==='lock'){modal={kind:'lock'};renderModal();}
 if(a==='place-lock')send({type:'support',effect:'lock',target:id});
 if(a==='event'){modal={kind:'event',id};selection={memory:IDOL.autoPay(state.players[0],id),discard:[],targets:[],target:null,actor:null};renderModal();}
 if(a==='pay'||a==='discard'){const key=a==='pay'?'memory':'discard',list=selection[key];selection[key]=list.includes(id)?list.filter(x=>x!==id):[...list,id];renderModal();}
 if(a==='event-target'){if(modal.id==='rai')selection.target=id;else selection.targets=selection.targets.includes(id)?selection.targets.filter(x=>x!==id):[...selection.targets,id];renderModal();}
 if(a==='event-actor'){selection.actor=Number(id);renderModal();}
 if(a==='event-confirm')send({type:'event',id:modal.id,...selection});
});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='first')firstMode=el.value;if(el.dataset.field==='actor'){const n=Number(el.value);selection.actors=el.checked?[...selection.actors,n]:selection.actors.filter(x=>x!==n);renderModal();}if(el.dataset.field==='boost'||el.dataset.field==='pick')selection[el.dataset.field]=el.checked;});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;renderModal();schedule();}});
render();
</script></body></html>
