function rng(s){s.seed=(Math.imul(s.seed,1664525)+1013904223)>>>0;return s.seed/4294967296;}

function setupHTML(){const l=CHAR[leader],ready=unitOK(unitConfig()),steps=[{id:'members',name:'メンバー',status:team.length+'/3'},{id:'leader',name:'リーダー',status:l?l.short:'未選択'},{id:'events',name:'イベント',status:chosenEvents.length+'/3'},{id:'match',name:'対戦準備',status:ready?'準備OK':'確認'}],index=Math.max(0,steps.findIndex(x=>x.id===setupTab)),step=steps[index],nextOK=index===0?team.length===3:index===1?team.length===3&&!!l:chosenEvents.length===3,instructions=['一覧から3人を選んでください。選択中のメンバーを押すと外せます。','3人のうち1人をリーダーに。能力・初期VOL・手札枚数を比べて選べます。','使用するイベントを3枚選んでください。','編成を確認して、対戦モードと相手を選んでください。'];return `<div class="casting-page unit-editor studio-tidy"><header class="studio-heading"><div><h1>${connectedSelection()?'接続中キャラ選択':'ユニット編成'}</h1><p>3人のメンバーでライブに挑もう。</p></div><div class="studio-tools">${btn('編成を呼び出す '+unitSlots.filter(Boolean).length+'/15','unit-library','')}${btn('この編成を保存','unit-save-open','',!ready)}${btn('新しく作る','unit-new','small')}</div></header>${connectedSelection()?connectedSelectionHTML():''}${unitStorageWarning?'<p class="storage-warning">'+unitStorageWarning+'</p>':''}${saved?'<div class="resume"><span>中断したライブ</span>'+btn('続きから再開','resume','small primary')+'</div>':''}<div class="studio-current"><span>選択中</span><div class="studio-member-names">${[0,1,2].map(i=>team[i]?'<span>'+CHAR[team[i]].name+(team[i]===leader?' <small>リーダー</small>':'')+'</span>':'<span class="unfilled">メンバー '+(i+1)+' 未選択</span>').join('')}</div><span class="draft-status" id="draft-status">${unitLoaded!==null?'保存枠 '+(unitLoaded+1)+(unitDirty()?' · 編集中':' · 保存済み'):'一時編成'}</span></div><nav class="studio-steps" aria-label="編成の手順">${steps.map((st,i)=>btn('<b>'+String(i+1)+'</b><span>'+st.name+'<small>'+st.status+'</small></span>','setup-'+st.id,index===i?'on':'',false,'aria-current="'+(index===i?'step':'false')+'"')).join('')}</nav><section class="studio-workspace" id="unit-roster"><div class="studio-step-title"><div><span>STEP ${index+1} / 4</span><h2>${['メンバーを3人選ぶ','リーダーを1人選ぶ','イベントを3枚選ぶ','確認して対戦する'][index]}</h2><p>${instructions[index]}</p></div>${index===0?btn("編成ランダム","unit-random","small"):""}</div>${setupTab==='members'?`<div class="roster-tools"><div><label for="roster-search">メンバーを検索</label><input id="roster-search" type="search" placeholder="名前・楽曲・能力で検索" value="${esc(rosterQuery)}" autocomplete="off"></div><div><label for="roster-filter">絞り込み</label><select id="roster-filter"><option value="all">すべてのメンバー</option><option value="series-original" ${rosterFilter==='series-original'?'selected':''}>オリジナル</option><option value="series-extra" ${rosterFilter==='series-extra'?'selected':''}>エクストラ</option><option value="selected" ${rosterFilter==='selected'?'selected':''}>選択中のみ</option>${[...new Set(IDS.map(id=>role[id]).filter(Boolean))].map(r=>'<option value="'+esc(r)+'" '+(rosterFilter===r?'selected':'')+'>'+esc(r)+'</option>').join('')}</select></div></div><div id="roster-results">${rosterResultsHTML()}</div>`:setupTab==='leader'?setupLeaderHTML():setupTab==='events'?`<div class="selected-event-box"><b>選択中 ${chosenEvents.length}/3</b><div>${chosenEvents.map(id=>'<button class="unit-event-remove" data-action="setup-event" data-id="'+id+'" aria-label="'+EVENTS[id].event+'を外す"><span>'+EVENTS[id].event+'</span><small>× 外す</small></button>').join('')||'<p>イベントはまだ選択されていません。</p>'}</div></div><div class="editor-event-panel">${eventChoicesHTML()}</div>`:setupMatchHTML()}<footer class="studio-step-footer">${index?btn('← '+steps[index-1].name+'へ戻る','setup-'+steps[index-1].id,''):'<small>選択が終わったら次へ進んでください。</small>'}${index<3?btn('次へ：'+steps[index+1].name+' →','setup-'+steps[index+1].id,'studio-next',!nextOK):''}</footer></section></div>`;}
function openingHTML(){const p=state.players[0],q=state.players[1],l=CHAR[p.leader];return `<div class="opening-overlay" role="dialog" aria-modal="true" aria-label="ライブ開始"><section class="opening-scene"><div class="opening-top">IDOL / LIVE DUEL <span>LIVE OPENING</span></div><div class="opening-versus"><div class="opening-unit"><small>YOUR UNIT</small><div class="opening-portrait">${art('idol-'+p.leader)}</div><h2>${l.name}</h2><p>${p.team.map(id=>CHAR[id].short).join(' / ')}</p></div><div class="opening-vs">VS<span>${state.active?rival()+'が先攻':'あなたが先攻'}</span></div><div class="opening-unit rival"><small>${net?'RIVAL UNIT':'CPU UNIT'}</small><div class="opening-portrait">${art('idol-'+q.leader)}</div><h2>${CHAR[q.leader].name}</h2><p>${q.team.map(id=>CHAR[id].short).join(' / ')}</p></div></div><div class="opening-skill"><small>YOUR LEADER SKILL</small><h3>${l.skillName}</h3><p>${l.skill}</p></div>${btn('ライブ開始 →','live-begin','opening-start')}</section></div>`;}
function moveNotice(){const m=lastMove;lastMove=null;if(!m)return '';return `<div class="move-announcement">${m.art?art(m.art):''}<div><b>${m.who}</b><strong>${m.title}</strong><small>${m.detail}</small></div></div>`;}

function costLabel(d){if(d.costEach)return '各メンバーのメモリー2枚ずつ、合計6枚';return d.cost[0]?d.short+' '+d.cost[0]+'枚以上を含む、合計ちょうど'+d.cost[1]+'メモリー':'合計ちょうど'+d.cost[1]+'メモリー';}
function eventSetupHTML(){return '<section class="panel" style="margin-top:22px"><div class="section-line"><h2>伏せるイベントを3枚選択</h2><span>'+chosenEvents.length+' / 3</span></div><p class="muted">専用・共通から合計3枚。専用イベントには対応するメンバーのメモリーが必要です。</p><div class="choice-grid" style="margin-top:12px">'+Object.entries(EVENTS).map(([id,d])=>'<button class="choice-card '+(chosenEvents.includes(id)?'on':'')+'" data-action="setup-event" data-id="'+id+'" aria-pressed="'+chosenEvents.includes(id)+'">'+art('event-'+id)+'<h3>'+d.event+'</h3><small>'+costLabel(d)+'<br>'+d.effect+'</small></button>').join('')+'</div></section>';}
function scoreHTML(p,i){return '<div class="score-panel '+(state.active===i?'turn':'')+'"><div class="score-head"><div><strong>'+(i?'CPU UNIT':'YOUR UNIT')+'</strong> <span class="tag">'+(state.active===i?'ON STAGE':'WAITING')+'</span></div><div class="score-number">'+IDOL.score(p)+'<small> / 20 pt</small></div></div><div class="score-team">'+p.team.map(id=>(id===p.leader?'♛ ':'')+CHAR[id].name).join(' / ')+'</div><div class="vol-row"><b>VOL</b><div class="vol-track"><i style="width:'+p.vol/2+'%"></i></div><b>'+p.vol+'％</b></div><div class="stats-row"><span>応援 <b>'+p.chips+'</b></span><span>山札 <b>'+p.deck.length+'</b></span><span>手札 <b>'+p.hand.length+'</b></span><span>メモリー <b>'+p.memory.length+'</b></span><span>捨て札 <b>'+p.discard.length+'</b></span></div><div class="mini-actions" style="margin-top:8px">'+btn('獲得観客 '+p.fans.length,'inspect','small flat',false,'data-zone="fans" data-p="'+i+'"')+btn('メモリー','inspect','small flat',false,'data-zone="memory" data-p="'+i+'"')+btn('捨て札','inspect','small flat',false,'data-zone="discard" data-p="'+i+'"')+'</div></div>';}
function fanHTML(f,idx=null,owner=null){const d=FAN[f.type],points=IDOL.fanPoints(owner,f);return '<div class="fan-card '+f.type+'">'+(idx!==null?'<div class="queue-label">'+(idx===0?'01 / 先頭':'0'+(idx+1))+'</div>':'')+'<div class="fan-head"><h3>'+d.name+'</h3><span class="points">'+points+'<small> PT</small></span></div>'+art('fan-'+f.type)+'<p>'+(f.muted?'効果無効（ターン終了まで）':d.text)+'</p>'+(f.lock!==null?'<span class="lock">'+(f.lock===0?'あなた':rival())+'の独占</span>':'')+'</div>';}
function songHTML(c,interactive=true){const d=IDOL.detail(c),p=state?.players[0],can=p&&!!IDOL.actors(p,c);return '<'+(interactive?'button':'div')+' class="song-card" style="--c:'+CHAR[c.owner].color+'" '+(interactive?'data-action="song" data-id="'+c.uid+'"':'')+'><div class="song-meta"><span>'+CHAR[c.owner].short+' / '+c.n+'人用</span><span>SONG</span></div><h3>'+d.name+'</h3>'+art('song-'+c.owner+'-'+c.n)+'<div class="song-line"><span>VOL</span><b>＋'+d.vol+'％</b></div><div class="song-line"><span>FAN <small>必要 '+d.need+'％</small></span><b>＋'+d.fan+'</b></div>'+(d.volText?'<p><b>vol：</b>'+d.volText+'</p>':'')+(d.fanText?'<p><b>fan：</b>'+d.fanText+'</p>':'')+(interactive&&!can?'<div class="unavailable">指定メンバー・行動人数が必要</div>':'')+'</'+(interactive?'button':'div')+'>';}
let lastMove=null, moveSerial=0,lastLotteryShown=null;
function itemHTML(c,action='item-info',on=false){const chip=c.item==='fanChip',support=c.item==='supportChip',bear=c.item==='teddy',ticket=c.item==='ticket',name=support?'応援チップ':chip?'ファンチップ':ticket?'くじ引き券':bear?'くまのぬいぐるみ':'肉';return `<button class="playing-card item-card ${support?'support-chip-card ':''}${on?'item-selected':''}" data-action="${action}" data-id="${c.uid}" style="--c:${support?'#577fbd':ticket?'#70a787':bear?'#c12e73':'#b68b43'}"><div class="card-title"><b>${name}</b><span>ITEM${c.count?' ×'+c.count:''}</span></div>${support?'<div class="fan-chip-art support-chip-art">✦</div>':chip?'<div class="fan-chip-art">★</div>':art(ticket?'item-ticket':bear?'item-teddy':'item-meat')}<div class="card-effect">${support?'応援効果の支払いに使う。効果は上の応援ボタンから。':chip?'1つにつき観客ポイント＋1。':ticket?'自分のターンに1枚捨ててくじを1回引く。行動不要。':bear?'獲得済みのファン1枚が離れるかわりに、このアイテム1つを捨てる（強制）。':'イベント支払い時、好きなキャラのメモリー1枚の代わりに使える。'}</div></button>`;}

function tableSong(c){const d=IDOL.detail(c),active=modal?.kind==='song'&&modal.id===c.uid,p=state.players[0],can=humanTurn()&&!!IDOL.actors(p,c),reason=!humanTurn()?'今は使用できません':!p.ready[p.team.indexOf(c.owner)]?CHAR[c.owner].short+'が行動済みです':'未行動のメンバーが足りません';return `<button class="playing-card ${active?'lifted':''} ${can?'playable':'unplayable'}" title="${can?'':reason}" style="--c:${CHAR[c.owner].color}" data-action="song" data-id="${c.uid}" aria-label="${esc(d.name)}を選ぶ"><div class="card-title"><b>${d.name}</b><span>${c.n}人</span></div>${art('song-'+c.owner+'-'+c.n)}<div class="card-modes"><span>VOL +${d.vol}%</span><span>FAN +${d.fan}<small> ${d.need}%〜</small></span></div><div class="card-effect">${d.volText?'vol：'+d.volText:''}${d.volText&&d.fanText?'<br>':''}${d.fanText?'fan：'+d.fanText:''}</div></button>`;}
function tableMember(id,j,i){const p=state.players[i],selected=i===0&&modal?.kind==='song',c=selected?p.hand.find(x=>x.uid===modal.id):null,on=selected&&selection.actors.includes(j);return `<button class="member-card ${p.ready[j]?'ready':'exhausted'} ${on?'actor-on':''}" data-action="${selected?'board-actor':'member-info'}" data-id="${j}" data-p="${i}" aria-label="${CHAR[id].short} ${p.ready[j]?'未行動':'行動済み'}${on?' 選択中':''}" ${selected&&!p.ready[j]?'disabled':''}><span class="member-badge">${(p.moeHeld||[]).includes(id)?'次の開始時は回復なし':p.leader===id?'♛ リーダー':p.ready[j]?'未行動':'行動済み'}</span>${art('idol-'+id)}<b>${CHAR[id].short}</b>${c&&id===c.owner?'<em>必須</em>':''}</button>`;}
function tableStacks(p,i){return `<div class="table-stacks">${btn('カード束','zones','mobile-zones',false,'data-p="'+i+'"')}<div class="pile deck-pile"><span>✦</span><b>${p.deck.length}</b><small>山札</small></div>${['memory','discard','fans'].map(z=>`<button class="pile ${z}" data-action="inspect" data-p="${i}" data-zone="${z}"><span>${z==='memory'?'≋':z==='fans'?'♡':'◇'}</span><b>${p[z].length}</b><small>${z==='memory'?'メモリー':z==='fans'?'獲得観客':'捨て札'}</small></button>`).join('')}</div>`;}
function tableEvents(p,i){return `<div class="table-events">${btn(i?'伏せ札 3':'イベント','events-menu','mobile-events',false,'data-p="'+i+'"')}<small>EVENTS</small><div>${p.events.map((e,j)=>`<button class="event-pocket ${e.used?'event-spent':''} ${!i&&IDOL.eventOK(state,0,e.id)?'event-ready':''}" ${i?'disabled':''} data-action="event" data-id="${e.id}" aria-label="${i?'相手の伏せイベント':EVENTS[e.id].event+(e.used?' 使用済み':'を確認')}">${i?'<span>✦</span>':art('event-'+e.id)}<b>${e.used?'済':j+1}</b></button>`).join('')}</div></div>`;}
function tableHUD(p,i){return `<div class="table-hud ${state.active===i?'your-stage':''}"><span>${i?rival():'YOU'} · ${CHAR[p.leader].short}</span><strong>${IDOL.score(p)}<small> /20</small></strong><div class="vol-meter"><b>VOL ${p.vol}%</b><i style="width:${p.vol/2}%"></i></div><span class="chip-count">✦ ${p.chips}${p.fanChips?' · ★ '+p.fanChips:''}</span>${IDOL.supportSealed(state,i)?'<span class="table-effects">ファンサ・応援封印中</span>':''}${p.leader==='aya'?'<span class="table-effects">楽曲 '+(p.songsPlayed||0)+'/3 · 終了時★'+((p.songsPlayed||0)>=3?2:0)+'</span>':''}${p.liveViewing||p.fanShield?'<span class="table-effects">'+(p.liveViewing?'★ ファンサ':'')+(p.liveViewing&&p.fanShield?' / ':'')+(p.fanShield?'獲得ファン保護':'')+'</span>':''}</div>`;}
function tableFan(f,j){const d=FAN[f.type],text={light:'効果なし',cheer:'応援チップ +1',trouble:'同時獲得の最高点1枚を戻す',heavy:'VOL −10%',core:'効果なし',dream:'春がメンバーなら獲得後1PT',reporter:'インフルエンサーを山札に追加',influencer:'効果なし',believer:'効果なし',anti:'効果なし'};const p=state.players[0],c=modal?.kind==='song'?p.hand.find(x=>x.uid===modal.id):null,n=c?IDOL.fanCount(p,c)+(selection.boost?1:0):0,targets=state.row.filter(x=>x.lock!==1).slice(0,n),preview=c&&IDOL.actors(p,c)&&p.vol>=IDOL.song(c).need&&!selection.pick&&targets.includes(f);return `<button class="audience-card ${f.type} ${preview?'target-preview':''}" data-action="fan-info" data-id="${f.uid}"><div class="audience-title"><b>${d.name}</b><strong>${d.points}<small>PT</small></strong></div>${art('fan-'+f.type)}<p>${f.muted?'効果無効 · このターン':text[f.type]}</p>${j===0?'<span class="front-tag">先頭</span>':''}${f.lock!==null?'<span class="exclusive">独占 · '+(f.lock?rival():'あなた')+'</span>':''}</button>`;}

function rulesHTML(){return '<div class="rules"><h3>1. 編成と勝利条件</h3><p>'+IDS.length+'人から3人を選び、1人をリーダーにします。専用楽曲は各3種類×3枚、3人で27枚。選んだメンバーの専用・共通イベントから異なる3枚を選び、伏せて用意します。初期volと初期手札はリーダーで決まります。</p><p>観客の得点と一時的な得点を合わせて20点以上で勝利。観客をまとめて獲得した場合は、マイナス効果を含むすべての処理を終えてから判定します。同時に20点以上になった場合は手番側が勝利します。</p><h3>2. ターンと楽曲</h3><ol><li>自分のアイドル全員を未行動に戻し、1枚ドロー。先攻の最初のターンだけドローなし。</li><li>楽曲、ファンサービス、イベント、応援チップ効果を好きな順で使用。いつでもターン終了できます。</li><li>楽曲には指定メンバーを含む1〜3人の未行動アイドルが必要。行動したアイドルはそのターン再使用できません。</li><li>volモードは必要volなし。fanモードは指定vol以上が必要ですが、volは消費しません。対応するモードの追加能力を先に処理してから、VOL上昇・ファン獲得を行います。観客効果の処理後に補充します。</li><li>使用した楽曲はメモリーへ。イベントのコストとして支払ったメモリーは捨て札へ。</li></ol><h3>佳代の開始時ドロー</h3><p>自分のターン開始時、通常ドローの直前に楽曲手札が4枚以下なら、1枚のかわりに2枚引きます。肉・ぬいぐるみなどのアイテムは数えません。初期手札や先攻最初のドローなし、楽曲・応援・イベントのドローには適用しません。佳代の旧能力による観客山札の閲覧はできません。</p><h3>3. ボルテージ・応援</h3><p>volの範囲は0〜200％。「－10％」は80％→70％のように増減します。手札上限はありません。</p><ul><li>ファンサービス：未行動1人を行動済みにして応援チップ1枚。各ターン2回まで。</li><li>応援チップ2枚：1枚ドロー。6枚：自分の全員を未行動に。</li><li>イベントの使用にアイドルの行動は不要。メモリー支払いは合計指定枚数ちょうど。機転は4メモリーで各自のターン1回・再使用可。秋奈のイベントは秋奈1メモリーで同一ターンにも何度でも使えます。その他は対戦中1回。ライブビューイングのファンチップ獲得はファンサービスだけに適用し、残りのゲーム中続きます。MCタイムは相手のカードによる獲得ファンの返却・移動を防ぎ、次の自分のターン開始時に解除します。自分の観客効果や自分のイベントには影響しません。センタースイッチで初期手札や初期volは再適用しません。</li></ul><h3>4. 観客</h3><p>初期観客山札は53枚（記者1枚を含む）。通常は公開中の観客を先頭から獲得します。一度に4枚以上なら、公開中の3枚を取り、残りはデッキ上から取ります。その後、空きを詰めて3枚に補充。相手の独占チップ付き観客は飛ばします。</p><table><thead><tr><th>観客</th><th>点</th><th>初期枚数</th><th>効果</th></tr></thead><tbody>'+Object.values(FAN).map(f=>'<tr><td>'+f.name+'</td><td>'+f.points+'</td><td>'+f.count+'</td><td>'+f.text+'</td></tr>').join('')+'</tbody></table><p>記者を獲得するたびに、ゲーム外から5点のインフルエンサー1枚を観客山札に加えてシャッフルします。一括獲得をすべて終え、観客効果を処理してから補充するため、追加したインフルエンサーは同じ一括獲得には含まれません。効果を失っている記者は追加を行いません。</p><p>獲得した観客は全員分の効果が発動します。先頭から処理し、厄介なファンはまだ戻されていない同時獲得観客から自身以外の最高得点1枚を戻します。同点なら獲得した側が選択。戻された観客も獲得時の効果は消えません。</p><h3>5. 独占・追加効果</h3><ul><li>独占チップは付け替え不可。観客がゾーンを離れると回収し、再び応援チップ1枚で置けます。</li><li>雷の選択獲得は通常獲得を丸ごと置き換えます。1・2人用は1枚、3人用は観客席と山札の上2枚の最大5枚から2枚を選び同時に獲得。選べる観客が2枚未満なら選べる分だけ獲得します。獲得枚数の増加は適用されません。見て選ばなかったデッキのカードは元の順番で戻します。交換イベントは山札にコアファンがある場合のみ使用できます。</li><li>華の強化は応援チップ効果の使用1回ごとに＋1。累積し、次のファン獲得で消費。volモードでは消費せず、ターン終了時に消滅。「雷鳴」の追加支払いでは発動しません。</li><li>夏芽のリーダー能力は自分の全メンバーの3人用楽曲に適用。専用イベントの強化は楽曲だけが対象です。</li></ul><h3>6. 追加メンバーとアイテム</h3><p>ゆめかわファンは初期山札に含まれない特殊観客。獲得側に春がいれば1点、いなければ0点。春のイベントで相手からも獲得できます。肉は手札のアイテムとして表示され、イベント支払い時に任意のキャラのメモリー1枚を代替して消費します。楽曲として使用・メモリー化・捨て札化はできません。ファンチップは1つ1点で保持され、手札にまとめて表示します。焔の楽曲で選んだ観客は獲得後もターン終了まで効果無効。焔のイベントは観客山札のみ無効化し、既に観客席にあるカードは無効化しません。ターン終了で全ての無効化が解除されます。</p><h3>光の手札交換とWHITEOUT</h3><p>光のリーダースキルはゲーム中1度、VOL100％以上のときだけ使用可能。手札3枚を捨てて応援チップ6枚を得ます。VOLは消費しません。リーダー変更で光に戻っても使用権は回復しません。楽曲の手札交換は任意で、指定枚数を全て捨てた場合だけ引きます。WHITEOUTは使用前の捨て札枚数を数え、2枚につきこのターン1点。その後、支払いメモリーを捨て札へ置きます。端数は切り捨てます。</p><h3>彩の再行動と連続獲得</h3><p>彩の2・3人用FAN効果は、観客の獲得・効果処理後にVOLを支払い、彩以外の仲間を未行動にします。VOL80％で2人用を使用し、追加で20％を払えます。ターン中の手札からの楽曲使用はVOL/FANとも1枚につき1回数え、3枚以上なら彩リーダーはターン終了時にファンチップ2枚を得ます。イベントやファンサービス、手札をメモリーに置く効果は数えません。彩のイベントは使用前のメモリー・捨て札の1人用を数え、最大6回、観客1人の獲得・観客効果・補充を順番に繰り返します。獲得枚数の増加は適用しません。</p><h3>恵美の交換と観客席の整理</h3><p>恵美リーダーは自分のターン開始時だけ、応援チップ2枚を支払い、獲得済みの厄介なファン1枚を信者（3点）に交換できます。対象が1枚でも選択し、今回は使わないことも可能。応援チップがない場合は発動しません。BLACK×MISSIONSは相手の現在1点の観客をアンチ（－3点）に交換します。交換元はゲーム外へ置き、信者・アンチはゲーム外から用意します。初期観客山札には含みません。交換は獲得ではないため獲得時効果は発動せず、既に処理した厄介なファンの効果も取り消しません。MCタイム中の相手は交換できず、ファンチップは対象外です。楽曲で観客席を戻す場合、相手の独占付き観客は選べません。戻した後に観客席を補充し、その後VOL上昇またはFAN獲得へ進みます。</p><h3>秋奈の選択ドローと楽曲回収</h3><p>秋奈のターン開始ドローは、山札の上から最大3枚を見て1枚選び、残りの山札全体をシャッフルします。初期手札4枚や応援などのドローには適用せず、先攻の最初のターンにも追加ドローしません。楽曲はVOL・FANどちらも効果処理後に、その使用カード自身をメモリーから手札へ戻すか選べます。使用メンバーの行動状態は戻りません。「真実は嘘より奇なり」は毎回秋奈1メモリーを支払い、選んだ手札の楽曲0枚以上をメモリーへ置きます。肉・ファンチップは移せません。1ターンの使用回数制限はありません。</p><h3>萌の信頼と応援効果</h3><p>萌の応援2枚の行動封じ（無料と通常を合わせ自分の各ターン1回）は、相手の行動済み1人について次の相手ターン開始時の回復だけを妨げます。別のカード効果で未行動には戻せます。1人への重複指定はできません。Friendsの後継「Dear Friends」はFAN＋1。1・2人用の次回ファンサ2倍は重複せず、応援チップまたはライブビューイングのファンチップを2枚得ます。回数は1回分で、各ターン2回までの制限を守ります。3人用は通常の効果処理後に自分の1人を未行動にし、可能ならその人でファンサを行います。ファンサ上限に達していれば未行動のままです。イベントは編成メンバー各2枚ずつ計6メモリー。肉は既存ルールで代用可能。このターン、応援3枚以下の応援効果を合計3回まで無料使用でき、通常支払いと選べます。応援6枚の全員回復は対象外。華のリーダーは無料使用でも発動します。</p><h3>仁奈とくまのぬいぐるみ</h3><p>仁奈リーダーはライトファン1枚の獲得ごとに応援チップ1つを得ます。観客自身の効果ではないため、ライトファンの効果無効中も発動します。仁奈のVOL楽曲は全てくまのぬいぐるみ1つを手札欄に加えます。ぬいぐるみは獲得済みファン1枚が離れるかわりに1つを捨てて残す強制効果で、自分・相手の効果、厄介なファン、交換にも有効。交換を防ぐと交換先も登場しません。肉と異なりメモリー支払いには使えず、楽曲のドロー・捨て札・メモリー化の対象外です。専用イベントは解決時に残っている個数だけファンチップを得て、ぬいぐるみを消費しません。</p><h3>エクストラのその他イベント</h3><p>プライベートコレクションは3メモリーでぬいぐるみ2つ。暴走舞台は2メモリーで数字1～5を選び、相手に同数のファンチップを与えてから自分のVOLを数字×20％上げます（上限200％）。炎上商法は5メモリー。獲得済みファンを全て戻し、実際に戻った枚数＋3枚をまとめて獲得し、観客効果も全て処理します。ぬいぐるみで残ったファンは戻した数に含めず、ファンチップは戻しません。華の累積・焔イベントの獲得数加算は適用します。唐突バズは3メモリーで山札のインフルエンサーと先頭を交換。獲得ではなく、交換元は同じ山札位置に戻し、シャッフルしません。相手の独占付き先頭は交換できません。全て使い切りで、指定キャラは不要です。</p><h3>あやめとくじ引き券</h3><p>自分のターン終了時、あやめリーダーは応援チップ2枚を捨てて券1枚を得てもよい（1回）。券は自分のターン中、他の効果の解決中でなければ1枚ずつ捨てて使用でき、アイドルの行動は不要。終了時に得た券は次の自分のターンから使います。あやめの1・2人用楽曲はVOLのみ、3人用はVOL・FANどちらでも券1枚を得ます。共有のくじ山札は15枚：大あたり1枚（ファンチップ5）、中あたり3枚（2）、小あたり5枚（1）、ハズレ5枚、爆弾1枚。結果を公開し、毎回戻してシャッフル。爆弾は自分の獲得済み観客をランダムに1人戻し、ぬいぐるみは強制で肩代わりします。観客がいなければ何も起きず、MCタイムでは防げません。券はメモリーに使えず、使用できる券が残る間は山札・手札切れで敗北しません。時間切れでは終了時の交換を行いません。</p><h3>フクロウの封印と破壊</h3><p>相手が観客カードを獲得すると、そのターン終了まで相手のファンサービスと応援効果（無料使用も含む）を封印します。ファンチップの獲得・交換だけでは発動しません。応援チップの獲得、楽曲・イベント・くじ引き券は使用可能です。萌の3人用は未行動化のみ行い、自動ファンサは行いません。楽曲の破壊は相手の全アイテムとファンチップ1枚ごとを同じ確率で抽選します。応援チップは対象外。くま自身の破壊をくまで防ぐことはできません。専用イベントは本人2枚を含む6メモリーで相手の応援を最大6枚奪い、ゲーム中1回だけ使用できます。</p><h3>7. 99秒の持ち時間</h3><p>CPU戦は時間制限なし。対人戦は各ターン99秒。相手に効果の選択を求める間は手番側の時計を止め、選択する相手に30秒の時計を表示します。30秒を過ぎると先頭の候補を自動選択し、手番側の残り時間から再開します。自身のカード選択や詳細表示中は通常の時計が進みます。時間切れでは未確定の使用を取り消し、発動済みの効果の選択を先頭の候補で自動処理してターン終了。対人戦では両者のライブ開始後から計測します。</p><h3>8. 敗北</h3><p>山札切れだけでは敗北しません。引けないドローは行わず続行。山札0枚・手札0枚・使用可能なイベントなし、の3条件をすべて満たすと敗北します。アイテムは楽曲手札とは別に数え、アイテムだけ残っていても使用可能なイベントがなければ敗北します。効果の途中ではなく、ひとまとまりの処理後に勝敗を判定します。</p></div>';}

 if(a==='zones'){modal={kind:'zones',p:Number(b.dataset.p)};renderModal();return;}

 if(a==='team'){if(team.includes(id))team=team.filter(x=>x!==id);else if(team.length<3)team.push(id);else{notify('先にメンバーを1人外してください');return;}if(!team.includes(leader))leader=team[0]||null;render();}
 if(a==='leader'){leader=id;render();}
 if(a==='cpu-setup'){openCpuSetup();return;}
 if(a==='cpu-random'){modal.draft=randomCpuConfig();renderModal();return;}
 if(a==='cpu-member'&&modal?.kind==='cpu-setup'){const c=modal.draft;if(c.team.includes(id))c.team=c.team.filter(x=>x!==id);else if(c.team.length<3)c.team.push(id);else{notify('先にメンバーを1人外してください');return;}if(!c.team.includes(c.leader))c.leader=c.team[0]||null;c.events=c.events.filter(x=>cpuEventPool(c.team).includes(x));renderModal();return;}
 if(a==='cpu-event'&&modal?.kind==='cpu-setup'){const c=modal.draft;if(c.events.includes(id))c.events=c.events.filter(x=>x!==id);else if(c.events.length<3)c.events.push(id);else{notify('先にイベントを1枚外してください');return;}renderModal();return;}
 if(a==='cpu-confirm'&&modal?.kind==='cpu-setup'){if(!cpuConfigOK(modal.draft))return;const launch=modal.launch;cpuConfig=JSON.parse(JSON.stringify(modal.draft));modal=null;if(launch)start(true);else render();return;}
 if(a==='start')start();
 if(a==='resume'){state=saved;screen='match';modal=null;resultShown=false;armCpuClock();render();clockTick();schedule();}
 if(a==='rules'||a==='catalog'){modal={kind:a,tab:'kayo'};renderModal();}

 if(a==='catalog-tab'){modal.tab=id;renderModal();}
 if(a==='close'&&modal?.kind==='unit-random-confirm'){modal=modal.returnTo||null;renderModal();return;}

 if(a==='close'){const wasSong=modal?.kind==='song';modal=null;if(wasSong)render();else renderModal();schedule();}
 if(a==='leave'){modal={kind:'leave'};renderModal();}

 if(a==='new-match'){clearTimeout(aiTimer);screen='setup';saved=null;modal=null;render();}

 if(a==='inspect'){modal={kind:'inspect',p:Number(b.dataset.p),zone:b.dataset.zone};renderModal();}

 if(a==='hikari-skill'&&humanTurn()&&state.players[0].leader==='hikari'&&state.players[0].vol>=100&&!state.players[0].hikariSkillUsed&&state.players[0].hand.length>=3){modal={kind:'hikari-skill'};selection={discard:[]};renderModal();return;}
 if(a==='hikari-discard'&&modal?.kind==='hikari-skill'){const xs=selection.discard;if(xs.includes(id))selection.discard=xs.filter(x=>x!==id);else if(xs.length<3)xs.push(id);renderModal();return;}
