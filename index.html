<script>/* IDOL rules engine. Browser-independent; commands and state are JSON serializable. */
const IDOL = (() => {
const CHAR = {
kayo:{skillName:'檻の向こうを見つめて',name:'小鳥遊佳代',short:'佳代',color:'#6179ed',vol:30,hand:6,skill:'自分のターン中、観客デッキの一番上をいつでも見てよい。',songs:['欲望の檻','鎖に囲まれて','革命は始まる'],event:'レヴォリューション・ラピスラズリ',cost:[3,6],effect:'手札を1〜3枚捨て、その枚数の観客を先頭からまとめて獲得。追加強化を含め獲得は最大3枚。'},

natsume:{skillName:'感動に定員なし！',name:'険崎夏芽',short:'夏芽',color:'#d8993d',vol:30,hand:5,skill:'自分の3人用楽曲のファン獲得枚数＋1。',songs:['ウェイヨ！','ノってけピーポー！','感動はもうすぐソコに！'],event:'求道エモ駆動',cost:[2,3],effect:'このターン中、自分の楽曲のファン獲得枚数＋1。'},
shio:{skillName:'興が乗っちゃって',name:'雲居時尾',short:'時尾',color:'#4faaa0',vol:40,hand:5,skill:'応援チップを得る時、1枚ごとに、代わりにボルテージ＋10％を選べる。',songs:['旅人','謳歌賛歌','遊楽道中'],event:'常盤戯ノ宴',cost:[4,6],effect:'ボルテージ180％以上なら、ターン終了時まで7ポイントを得る。'},
rai:{skillName:'欲しけりゃ、奪ってみろ',name:'赤兎雷',short:'雷',color:'#d97382',vol:30,hand:5,skill:'独占チップ1枚を持つ。追加応援効果：応援チップ1枚で観客1枚に独占チップを置く。相手はそれを飛ばして獲得し、相手の効果では移動できない。',songs:['雷鳴','暴れハート','運命命運破壊音'],event:'アイアム・デストロイヤー',cost:[3,5],effect:'観客デッキのコアファン1枚と観客ゾーンの1枚を交換し、観客デッキをシャッフル。'},
hana:{skillName:'君の拍手で、今日をつなぐ',name:'入間華',short:'華',color:'#e07aa6',vol:30,hand:5,skill:'応援チップ効果を使うたび、このターンの次のファン獲得枚数＋1。累積し、ファン獲得時にまとめて消費。',songs:['招待状','紅いカーテン','君と私の平和条約'],event:'ピース・ピース・サーカスドーム',cost:[2,4],effect:'自分の行動済みアイドル1人を未行動にする。'},
haru:{skillName:'夢のつづきを、もう一度',name:'福園春',short:'春',color:'#b488db',vol:30,hand:5,skill:'自分のターン開始時、捨て札の楽曲1枚を選び、手札に加える。',songs:['虹空','夢見るだけじゃ足りないの','ふわふわ理想郷へようこそ！'],event:'ゆめかわ★ゆーとぴあ',cost:[2,5],effect:'観客席と相手の獲得済みエリアにある「ゆめかわファン」を全てまとめて獲得する。相手の独占付き観客は除く。'},
hakka:{skillName:'冒険はこれからだ！',name:'一条白花',short:'白花',color:'#ca9944',vol:30,hand:4,skill:'イベント発動時、行動済みの自分のアイドル1人を未行動にしてもよい。',songs:['八戒','天下御免','黄金冒険譚'],event:'地獄極楽感謝祭',cost:[4,4],effect:'ファンチップを2つ得る。その後、残りの自分のメモリーを全て捨て、こうして捨てた楽曲3枚につきファンチップを1つ得る。'},
homura:{skillName:'皆の願いが希望だにょ',name:'紅松焔',short:'焔',color:'#df5a4f',vol:20,hand:4,skill:'自分のターン開始時、応援チップを1つ得る。',songs:['駆け抜ける炎','ヒーロー登場だにょ！','希望の翼をブレイブオン'],event:'ジャスティス・Z・ハリケーン',cost:[4,7],effect:'このターン、観客山札のカードは効果を失い、自分のカードの獲得ファン数＋1。既に観客席にあるカードには無効化しない。'}
};
const COMMON = {
redo:{event:'やり直し',short:'共通',color:'#73878b',cost:[0,3],effect:'観客ゾーンの観客をすべて観客デッキに戻してシャッフルし、空きを補充する。相手の独占チップ付き観客は移動しない。'},
switch:{event:'センタースイッチ',short:'共通',color:'#73878b',cost:[0,3],effect:'別のメンバーをリーダーにする。前のリーダー能力で得た独占チップなどは取り除く。初期vol・手札は変更しない。'},
trouble:{event:'会場トラブル',short:'共通',color:'#73878b',cost:[0,4],effect:'自分の獲得観客をランダムに1枚戻し、その後、相手の獲得観客をランダムに2枚観客デッキの下に戻す。'},
wit:{event:'機転',short:'共通',color:'#73878b',cost:[0,2],repeat:true,effect:'手札1枚を選んでメモリーに置き、1枚ドロー。再使用可能。自分の各ターン1回まで。'}
};
const EVENTS={...CHAR,...COMMON};
const FAN = {
light:{name:'ライトファン',points:1,count:14,text:'効果なし',icon:'♡'},
cheer:{name:'応援するファン',points:1,count:14,text:'応援チップ＋1',icon:'✦'},
trouble:{name:'厄介なファン',points:1,count:12,text:'自身以外の同時獲得観客から最高得点の1枚を観客デッキの下へ戻す。',icon:'！'},
heavy:{name:'愛が重いファン',points:2,count:8,text:'ボルテージ－10％',icon:'♥'},
core:{name:'コアファン',points:3,count:4,text:'効果なし',icon:'★'},
dream:{name:'ゆめかわファン',points:0,count:0,text:'獲得側のメンバーに春がいるなら1ポイント。初期山札には含まれない。',icon:'☁'}
};
function song(c){return {name:CHAR[c.owner].songs[c.n-1],owner:c.owner,n:c.n,vol:c.n*10+(c.owner==='shio'?10:0),fan:c.owner==='natsume'&&c.n===3?4:c.n,need:[60,80,100][c.n-1]};}
function detail(c){const d=song(c);d.volText=c.owner==='kayo'?'カードを1枚引く。':c.owner==='hana'?'応援チップを1枚得る。':'';d.fanText=c.owner==='machi'?(c.n===3?'相手の獲得済み観客をランダムに1枚戻す。':'相手は自身の獲得済み観客1枚を選んで戻す。'):c.owner==='natsume'&&c.n<3?'volを追加で10％下げると、獲得枚数＋1。':c.owner==='rai'?(c.n===1?'応援チップ1枚で通常獲得の代わりに観客ゾーンの1枚を選んで獲得。':c.n===2?'通常獲得の代わりに観客ゾーンの1枚を選んで獲得してもよい。':'通常獲得の代わりに観客デッキの上2枚を見て、その中または観客ゾーンから1枚獲得してもよい。'):c.owner==='hana'&&c.n===3?'応援チップを1枚得る。':'';if(c.owner==='haru'){d.volText=c.n===3?'ゆめかわファン1枚を観客山札の一番上に置く。':'';d.fanText=c.n<3?'ゆめかわファン1枚を観客山札の一番上に置く。':'獲得済みのゆめかわファンが2枚以上なら、獲得枚数＋1。';}
if(c.owner==='hakka'){d.volText='肉を1つ得る。';d.fanText=c.n===3?'肉を1つ得る。':'';}
if(c.owner==='homura')d.fanText='観客席のカードを'+(c.n===3?2:1)+'枚まで選び、ターン終了時まで効果を無効にする。';return d;}
function rng(s){s.seed=(Math.imul(s.seed,1664525)+1013904223)>>>0;return s.seed/4294967296;}
function shuffle(s,a){for(let i=a.length-1;i>0;i--){let j=Math.floor(rng(s)*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function uid(s){return 'c'+s.serial++;}
function log(s,t){s.log.push(t);if(s.log.length>120)s.log.shift();}
function voltage(p,n){p.vol=Math.max(0,Math.min(200,p.vol+n));}
function fanPoints(p,f){return f.type==='dream'?(p?.team.includes('haru')&&!f.muted?1:0):FAN[f.type].points;}
function score(p){return p.fans.reduce((a,f)=>a+fanPoints(p,f),0)+(p.temp||0)+(p.fanChips||0);}
function items(p){return p.items||[];}
function paymentCards(p){return [...p.memory,...items(p)];}
function paymentOK(p,id,paid){const d=EVENTS[id],cards=paymentCards(p);return Array.isArray(paid)&&paid.length===d.cost[1]&&new Set(paid).size===paid.length&&paid.every(x=>cards.some(c=>c.uid===x))&&cards.filter(c=>paid.includes(c.uid)&&(c.owner===id||c.item==='meat')).length>=d.cost[0];}
function meat(s,p){(p.items??=[]).push({uid:uid(s),item:'meat'});log(s,'肉を1つ獲得（手札のアイテム）');}
function dream(s){s.audience.unshift({uid:uid(s),type:'dream',lock:null,muted:s.deckMuteTurn===s.turn});log(s,'ゆめかわファンを観客山札の一番上に置いた');}

function draw(s,i,n=1){const p=s.players[i];let got=0;while(n-->0&&p.deck.length){p.hand.push(p.deck.shift());got++;}if(got)log(s,(i?'CPU':'あなた')+'：'+got+'枚ドロー');}
function fill(s){while(s.row.length<3&&s.audience.length){const f=s.audience.shift();if(s.deckMuteTurn===s.turn)f.muted=true;s.row.push(f);}}

function unlocked(s,i){return s.row.filter(f=>f.lock===null||f.lock===i);}
function eventOK(s,i,id){const p=s.players[i],d=EVENTS[id];return !!d&&p.events.some(e=>e.id===id&&!e.used&&(!d.repeat||e.lastTurn!==s.turn))&&paymentCards(p).length>=d.cost[1]&&paymentCards(p).filter(c=>c.owner===id||c.item==='meat').length>=d.cost[0]&&(id!=='shio'||p.vol>=180)&&(id!=='wit'||p.hand.length>0)&&(id!=='kayo'||p.hand.length>0)&&(id!=='hana'||p.ready.some(x=>!x))&&(id!=='rai'||(s.audienceCoreCount??s.audience.filter(f=>f.type==='core').length)>0&&unlocked(s,i).length>0);}

function finish(s){
 if(s.queue.length||s.pending)return;
 const winners=s.players.map((p,i)=>score(p)>=20?i:-1).filter(i=>i>=0);
 if(winners.length){s.winner=winners.includes(s.active)?s.active:winners[0];log(s,s.winner?'CPUの勝利！':'あなたの勝利！');return;}
 for(let i=0;i<2;i++){const p=s.players[i];if(!p.deck.length&&!p.hand.length&&!p.events.some(e=>eventOK(s,i,e.id))){s.winner=1-i;log(s,(i?'CPU':'あなた')+'は山札・手札がなく、使用可能なイベントもないため敗北。');return;}}
}
function removeFan(s,i,id){const p=s.players[i],at=p.fans.findIndex(f=>f.uid===id);if(at<0)return;const f=p.fans.splice(at,1)[0];f.lock=null;s.audience.push(f);log(s,FAN[f.type].name+'を観客デッキの下へ戻した');}
function moveOut(s,f){s.row=s.row.filter(x=>x.uid!==f.uid);s.audience=s.audience.filter(x=>x.uid!==f.uid);f.lock=null;}
function gain(s,i,list){
 if(!list.length)return;
 for(const f of list){if(s.audience.some(x=>x.uid===f.uid)&&s.deckMuteTurn===s.turn)f.muted=true;for(const p of s.players)p.fans=p.fans.filter(x=>x.uid!==f.uid);moveOut(s,f);s.players[i].fans.push(f);}
 log(s,(i?'CPU':'あなた')+'：'+list.map(f=>FAN[f.type].name).join('・')+'を獲得');
 const ids=list.map(f=>f.uid);
 s.queue.unshift(...list.map(f=>({kind:'fanEffect',p:i,f:JSON.parse(JSON.stringify(f)),batch:ids})),{kind:'fill',p:i});
}
function normal(s,i,n){const list=unlocked(s,i).slice(0,n);let left=n-list.length;for(let j=0;j<left&&j<s.audience.length;j++)list.push(s.audience[j]);gain(s,i,list);}
function choice(s,kind,p,options,text,extra={}){s.pending={kind,p,options,text,...extra};}
function chipEffect(s,p){if(s.players[p].leader==='hana'){s.players[p].buff++;log(s,'華：次のファン獲得＋'+s.players[p].buff);}}
function process(s){
 while(s.queue.length&&!s.pending&&s.winner===null){
 const e=s.queue.shift(),p=s.players[e.p];
 if(e.kind==='fill')fill(s);
 if(e.kind==='vol')voltage(p,e.n);
 if(e.kind==='recover'&&p.discard.length)choice(s,'recover',e.p,p.discard.map(c=>c.uid),'春：捨て札から手札に戻す楽曲を1枚選択');
 if(e.kind==='hakkaReady'&&p.ready.some(x=>!x))choice(s,'hakkaReady',e.p,[...p.ready.flatMap((r,j)=>r?[]:[String(j)]),'skip'],'白花：未行動にするアイドルを1人選択（任意）');
 if(e.kind==='mutePick'){const opts=s.row.filter(f=>!f.muted&&!e.selected.includes(f.uid)).map(f=>f.uid);if(opts.length&&e.left>0)choice(s,'mutePick',e.p,[...opts,'skip'],'焔：効果を失わせる観客を選択（あと'+e.left+'枚まで）',{left:e.left,selected:e.selected});}
 if(e.kind==='draw')draw(s,e.p);
 if(e.kind==='chip'){
 if(p.leader==='shio')choice(s,'shio',e.p,['chip','vol'],'時尾：応援チップ1枚か、vol＋10％を選択');

function rulesHTML(){return '<div class="rules"><h3>1. 編成と勝利条件</h3><p>9人から3人を選び、1人をリーダーにします。専用楽曲は各3種類×3枚、3人で27枚。選んだメンバーの専用・共通イベントから異なる3枚を選び、伏せて用意します。初期volと初期手札はリーダーで決まります。</p><p>観客の得点と一時的な得点を合わせて20点以上で勝利。観客をまとめて獲得した場合は、マイナス効果を含むすべての処理を終えてから判定します。</p><h3>2. ターンと楽曲</h3><ol><li>自分のアイドル全員を未行動に戻し、1枚ドロー。先攻の最初のターンだけドローなし。</li><li>楽曲、ファンサービス、イベント、応援チップ効果を好きな順で使用。いつでもターン終了できます。</li><li>楽曲には指定メンバーを含む1〜3人の未行動アイドルが必要。行動したアイドルはそのターン再使用できません。</li><li>volモードは必要volなし。fanモードは指定vol以上が必要ですが、volは消費しません。対応するモードの追加能力を先に処理してから、VOL上昇・ファン獲得を行います。観客効果の処理後に補充します。</li><li>使用した楽曲はメモリーへ。イベントのコストとして支払ったメモリーは捨て札へ。</li></ol><h3>3. ボルテージ・応援</h3><p>volの範囲は0〜200％。「－10％」は80％→70％のように増減します。手札上限はありません。</p><ul><li>ファンサービス：未行動1人を行動済みにして応援チップ1枚。各ターン2回まで。</li><li>応援チップ2枚：1枚ドロー。6枚：自分の全員を未行動に。</li><li>イベントの使用にアイドルの行動は不要。メモリー支払いは合計指定枚数ちょうど。機転は各自のターン1回で再使用可、その他は対戦中1回。センタースイッチで初期手札や初期volは再適用しません。</li></ul><h3>4. 観客</h3><p>共有デッキは52枚。通常は公開中の観客を先頭から獲得します。一度に4枚以上なら、公開中の3枚を取り、残りはデッキ上から取ります。その後、空きを詰めて3枚に補充。相手の独占チップ付き観客は飛ばします。</p><table><thead><tr><th>観客</th><th>点</th><th>枚数</th><th>効果</th></tr></thead><tbody>'+Object.values(FAN).map(f=>'<tr><td>'+f.name+'</td><td>'+f.points+'</td><td>'+f.count+'</td><td>'+f.text+'</td></tr>').join('')+'</tbody></table><p>獲得した観客は全員分の効果が発動します。先頭から処理し、厄介なファンはまだ戻されていない同時獲得観客から自身以外の最高得点1枚を戻します。同点なら獲得した側が選択。戻された観客も獲得時の効果は消えません。</p><h3>5. 独占・追加効果</h3><ul><li>独占チップは付け替え不可。観客がゾーンを離れると回収し、再び応援チップ1枚で置けます。</li><li>雷の選択獲得は通常獲得を丸ごと置き換えて1枚獲得。見て選ばなかったデッキのカードは元の順番で戻します。</li><li>華の強化は応援チップ効果の使用1回ごとに＋1。累積し、次のファン獲得で消費。volモードでは消費せず、ターン終了時に消滅。「雷鳴」の追加支払いでは発動しません。</li><li>夏芽のリーダー能力は自分の全メンバーの3人用楽曲に適用。専用イベントの強化は楽曲だけが対象です。</li></ul><h3>6. 追加メンバーとアイテム</h3><p>ゆめかわファンは初期52枚に含まれない特殊観客。獲得側に春がいれば1点、いなければ0点。春のイベントで相手からも獲得できます。肉は手札のアイテムとして表示され、イベント支払い時に任意のキャラのメモリー1枚を代替して消費します。楽曲として使用・メモリー化・捨て札化はできません。ファンチップは1つ1点で保持され、手札にまとめて表示します。焔の楽曲で選んだ観客は獲得後もターン終了まで効果無効。焔のイベントは観客山札のみ無効化し、既に観客席にあるカードは無効化しません。ターン終了で全ての無効化が解除されます。</p><h3>7. 60秒の持ち時間</h3><p>CPU戦は時間制限なし。対人戦は各ターン60秒で、カード選択や詳細表示中も時計は進みます。時間切れでは未確定の使用を取り消し、発動済みの効果の選択を先頭の候補で自動処理してターン終了。対人戦では両者のライブ開始後から計測します。</p><h3>8. 敗北</h3><p>山札切れだけでは敗北しません。引けないドローは行わず続行。山札0枚・手札0枚・使用可能なイベントなし、の3条件をすべて満たすと敗北します。アイテムは楽曲手札とは別に数え、アイテムだけ残っていても使用可能なイベントがなければ敗北します。効果の途中ではなく、ひとまとまりの処理後に勝敗を判定します。</p><div class="rule-note">試作での処理：同時に20点以上なら手番プレイヤーを優先。観客デッキにコアファンがない場合、雷の交換イベントは使用不可。独占チップはゲーム開始時に手元へ用意。CPUの手札・伏せたイベントは表示しません。</div></div>';}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
 const a=b.dataset.action,id=b.dataset.id;
 if(a==='mode-cpu'||a==='mode-online'){battleMode=a==='mode-online'?'online':'cpu';render();return;}
 if(a.startsWith('online-')){onlineAction(a).catch(e=>{if(net){net.busy=false;net.error=e.message;net.status='暗号と回線を確認してください。';renderModal();}});return;}

 if(a==='hand-scroll'){const track=$('.hand-track');if(track)track.scrollBy({left:Number(b.dataset.dir)*Math.max(140,track.clientWidth*.75),behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});return;}
 if(a==='live-begin'){if(net){onlineReady();return;}modal=null;armCpuClock();renderModal();schedule();return;}
 if(a==='board-actor'&&humanTurn()&&modal?.kind==='song'){const j=Number(id),p=state.players[0];if(p.ready[j]){const c=p.hand.find(c=>c.uid===modal.id);if(selection.actors.includes(j))selection.actors=selection.actors.filter(x=>x!==j);else if(c&&selection.actors.length<c.n)selection.actors.push(j);else{notify('必要人数まで選択済みです。先に1人外してください');return;}render();}return;}
 if(a==='zones'){modal={kind:'zones',p:Number(b.dataset.p)};renderModal();return;}
 if(a==='events-menu'){modal={kind:'events-menu',p:Number(b.dataset.p)};renderModal();return;}
 if(a==='member-info'){const i=Number(b.dataset.p),j=Number(id),p=state.players[i];modal={kind:'member-info',p:i,j};renderModal();return;}
 if(a==='fan-info'){modal={kind:'fan-info',id};renderModal();return;}
 if(a==='table-log'){modal={kind:'table-log'};renderModal();return;}
 if(a==='setup-event'){if(chosenEvents.includes(id))chosenEvents=chosenEvents.filter(x=>x!==id);else if(chosenEvents.length<3)chosenEvents.push(id);else{notify('イベントは合計3枚です。先に1枚外してください');return;}render();}
 if(a==='team'){if(team.includes(id))team=team.filter(x=>x!==id);else if(team.length<3)team.push(id);else{notify('先にメンバーを1人外してください');return;}if(!team.includes(leader))leader=team[0]||null;render();}
 if(a==='leader'){leader=id;render();}
 if(a==='start')start();
 if(a==='resume'){state=saved;screen='match';modal=null;resultShown=false;armCpuClock();render();clockTick();schedule();}
 if(a==='rules'||a==='catalog'){modal={kind:a,tab:'kayo'};renderModal();}
 if(a==='common-catalog'){modal={kind:'common-catalog'};renderModal();}
 if(a==='catalog-tab'){modal.tab=id;renderModal();}
 if(a==='close'){const wasSong=modal?.kind==='song';modal=null;if(wasSong)render();else renderModal();schedule();}
 if(a==='leave'){modal={kind:'leave'};renderModal();}
 if(a==='leave-confirm'){if(net){leaveOnline();return;}clearTimeout(aiTimer);saved=state;screen='setup';modal=null;render();}
 if(a==='new-match'){clearTimeout(aiTimer);screen='setup';saved=null;modal=null;render();}
 if(a==='rematch')start();
 if(a==='inspect'){modal={kind:'inspect',p:Number(b.dataset.p),zone:b.dataset.zone};renderModal();}
 if(a==='peek'&&humanTurn()){modal={kind:'peek'};renderModal();}
 if(a==='item-info'){modal={kind:'item',id};renderModal();}
 if(a==='song'){if(!humanTurn()){notify('あなたの手番で効果の処理後に使えます');return;}const c=state.players[0].hand.find(c=>c.uid===id);if(!c)return;modal={kind:'song',id};selection={actors:IDOL.actors(state.players[0],c)||[],boost:false,pick:false};render();}
 if(a==='play-vol'||a==='play-fan'){if(modal?.kind!=='song'||!humanTurn())return;send({type:'play',card:modal.id,actors:selection.actors,mode:a==='play-vol'?'vol':'fan',boost:a==='play-fan'&&selection.boost,pick:a==='play-fan'&&selection.pick});}
 if(a==='service')send({type:'service',actor:Number(id)});
 if(a==='draw'||a==='refresh')send({type:'support',effect:a});
 if(a==='end')send({type:'end'});
 if(a==='choose')send({type:'choose',value:id});
 if(a==='lock'){modal={kind:'lock'};renderModal();}
 if(a==='place-lock')send({type:'support',effect:'lock',target:id});
 if(a==='event'){modal={kind:'event',id};selection={memory:IDOL.autoPay(state.players[0],id),discard:[],targets:[],target:null,actor:null};renderModal();}
 if(a==='discard'&&!selection.discard.includes(id)&&selection.discard.length>=3){notify('捨てる手札は最大3枚です');return;}
 if(a==='pay'||a==='discard'){const key=a==='pay'?'memory':'discard',list=selection[key];if(list.includes(id))selection[key]=list.filter(x=>x!==id);else{if(a==='pay'&&list.length>=EVENTS[modal.id].cost[1]){notify('支払いは指定枚数ちょうどです。先に1枚外してください');return;}selection[key]=[...list,id];}renderModal();}
 if(a==='event-target'){if(modal.id==='rai')selection.target=id;else selection.targets=selection.targets.includes(id)?selection.targets.filter(x=>x!==id):[...selection.targets,id];renderModal();}
 if(a==='event-actor'){selection.actor=Number(id);renderModal();}
 if(a==='wit-hand'){selection.hand=id;renderModal();}
 if(a==='switch-leader'){selection.leader=id;renderModal();}
 if(a==='event-confirm'&&modal?.kind==='event'&&humanTurn())send({type:'event',id:modal.id,...selection});
});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='first')firstMode=el.value;if(el.dataset.field==='actor'){const n=Number(el.value);selection.actors=el.checked?[...selection.actors,n]:selection.actors.filter(x=>x!==n);renderModal();}if(el.dataset.field==='boost'||el.dataset.field==='pick'){selection[el.dataset.field]=el.checked;if(modal?.kind==='song')render();}});
document.addEventListener('scroll',e=>{if(e.target.matches?.('.hand-track'))updateHandScroll();},true);
document.defaultView?.addEventListener('resize',updateHandScroll);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){if(['online','opening','online-ready','online-disconnect'].includes(modal.kind))return;const song=modal.kind==='song';modal=null;if(song)render();else renderModal();schedule();}});
render();
</script><script src="rooms.js"></script></body></html>
