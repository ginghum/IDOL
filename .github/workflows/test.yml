name: Game rules
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for test in tests/*.test.mjs; do node "$test" || exit 1; done
      - run: node room-server/rooms.test.mjs
